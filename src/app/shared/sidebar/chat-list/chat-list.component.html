<div class="flex flex-col gap-1 mt-2">
    @if (chatService.isLoadingChats()) {
    <div class="text-center py-4">
        <p class="text-gray-500 dark:text-gray-400 text-sm">Cargando chats...</p>
    </div>
    } @else if (chatService.chats().length === 0) {
    <div class="text-center py-4">
        <p class="text-gray-500 dark:text-gray-400 text-sm">No hay chats. ¡Crea uno nuevo!</p>
    </div>
    } @else {
    @for (chat of chatService.chats(); track chat._id) {
    <div (click)="onChatSelect(chat._id)" [class.bg-primary/20]="chatService.currentChatId() === chat._id"
        [class.dark:bg-primary/30]="chatService.currentChatId() === chat._id"
        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer group">
        <span class="material-symbols-outlined text-gray-800 dark:text-white text-[20px]">chat_bubble</span>

        @if (editingChatId === chat._id) {
        <input #titleInput [value]="chat.title || 'Nuevo Chat'" (click)="$event.stopPropagation()"
            (blur)="saveEdit(chat._id, titleInput.value)" (keydown.enter)="saveEdit(chat._id, titleInput.value)"
            (keydown.escape)="cancelEditing()" autofocus
            class="flex-1 bg-white dark:bg-black/20 text-gray-900 dark:text-white text-sm font-medium px-2 py-1 rounded border border-primary/50 outline-none min-w-0">
        } @else {
        <p (dblclick)="startEditing(chat._id, $event)"
            class="text-gray-900 dark:text-white text-sm font-medium leading-normal truncate flex-1 select-none"
            title="Doble click para renombrar">
            {{ chat.title || 'Nuevo Chat' }}
        </p>
        }

        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
            <button (click)="onRenameChat(chat._id, $event)"
                class="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded" title="Renombrar">
                <span class="material-symbols-outlined text-gray-600 dark:text-gray-400 text-[16px]">edit</span>
            </button>
            <button (click)="onDeleteChat(chat._id, $event)"
                class="p-1 hover:bg-black/10 dark:hover:bg-white/10 rounded" title="Eliminar">
                <span class="material-symbols-outlined text-gray-600 dark:text-gray-400 text-[16px]">delete</span>
            </button>
        </div>
    </div>
    }
    }
</div>
