<div class="px-2 md:px-6 pb-2 md:pb-4 bg-background-light dark:bg-background-dark shrink-0">
  <div class="mx-auto max-w-4xl">
    <div
      class="flex items-end px-2 md:px-3 py-2 gap-2 md:gap-3 bg-white dark:bg-black/20 rounded-xl border border-gray-200 dark:border-gray-700 focus-within:ring-2 focus-within:ring-primary shadow-sm"
      [class.opacity-50]="isDisabled()">
      <label class="flex flex-col min-w-0 flex-1">
        <div class="flex w-full flex-1 items-stretch">
          <textarea [(ngModel)]="messageInput" (keydown.enter)="handleEnter($any($event))" [disabled]="isDisabled()"
            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden bg-transparent text-gray-900 dark:text-white focus:outline-0 focus:ring-0 border-none h-auto py-2.5 placeholder:text-gray-500 dark:placeholder:text-[#9dabb8] px-1 text-sm md:text-base font-normal leading-normal disabled:cursor-not-allowed"
            placeholder="Send a message..." rows="1"></textarea>
        </div>
      </label>
    
      <div class="flex items-center gap-1 self-end pb-1.5 shrink-0">
        
        <button (click)="onSend()" [disabled]="isDisabled()"
          class="flex items-center justify-center overflow-hidden rounded-lg size-8 md:size-9 bg-primary hover:bg-primary/90 text-white cursor-pointer ml-1 md:ml-2 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-sm">
          <span class="material-symbols-outlined text-[18px] md:text-[20px]">send</span>
        </button>
      </div>
    </div>
  </div>
</div>
