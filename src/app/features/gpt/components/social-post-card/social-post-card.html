<div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-black/20 overflow-hidden">
  <div class="flex items-center justify-between p-3 bg-black/5 dark:bg-white/5">
    <div class="flex items-center gap-2">
      <img 
        [src]="iconUrl()" 
        [alt]="platformLabel()" 
        (error)="onIconError($event)"
        class="w-5 h-5">
      
      <h3 class="font-bold text-gray-900 dark:text-white">{{ platformLabel() }}</h3>
    </div>
    <button (click)="onCopy()" class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
      <span class="material-symbols-outlined text-[20px]">content_copy</span>
    </button>
  </div>
  <div class="p-4">
    <p class="text-gray-800 dark:text-gray-200 text-base font-normal leading-relaxed" [innerHTML]="formattedContent()"></p>
  </div>
</div>
