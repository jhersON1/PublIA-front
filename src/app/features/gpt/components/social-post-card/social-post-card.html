<div
  class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-black/20 overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 animate-fade-in-up">
  <div
    class="flex items-center justify-between p-3 bg-gray-50/50 dark:bg-white/5 border-b border-gray-100 dark:border-gray-800">
    <div class="flex items-center gap-2.5">
      <img [src]="iconUrl()" [alt]="platformLabel()" (error)="onIconError($event)" class="w-5 h-5 object-contain">
      <h3 class="font-semibold text-sm text-gray-900 dark:text-white">{{ platformLabel() }}</h3>

      <!-- WhatsApp publish type selector -->
      @if (isWhatsApp()) {
      <div class="flex items-center gap-2 ml-2 pl-2 border-l border-gray-300 dark:border-gray-600">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="whatsapp-type-{{platformLabel()}}" value="status"
            [checked]="(post().whatsappPublishType || 'status') === 'status'"
            (change)="onWhatsAppPublishTypeChange('status')"
            class="w-3.5 h-3.5 text-primary focus:ring-2 focus:ring-primary/50">
          <span class="text-xs text-gray-700 dark:text-gray-300">Estado</span>
        </label>
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="radio" name="whatsapp-type-{{platformLabel()}}" value="number"
            [checked]="post().whatsappPublishType === 'number'" (change)="onWhatsAppPublishTypeChange('number')"
            class="w-3.5 h-3.5 text-primary focus:ring-2 focus:ring-primary/50">
          <span class="text-xs text-gray-700 dark:text-gray-300">Número</span>
        </label>
      </div>
      }
    </div>
    <div class="flex items-center gap-1">
      <button type="button" (click)="toggleEditing()"
        class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary rounded-lg hover:bg-primary/10 dark:hover:bg-primary/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 transition-colors"
        [attr.aria-pressed]="isEditing()" title="Editar">
        <span class="material-symbols-outlined text-[18px]">edit</span>
      </button>
      <button type="button" (click)="onCopy()"
        class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-green-600 dark:hover:text-green-400 rounded-lg hover:bg-green-50 dark:hover:bg-green-900/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-green-500/40 transition-colors"
        title="Copiar">
        <span class="material-symbols-outlined text-[18px]">content_copy</span>
      </button>
    </div>
  </div>

  <div class="p-4 transition-colors duration-200" [class.bg-gray-50]="isEditing()"
    [class.dark:bg-white/5]="isEditing()">

    @if (isEditing()) {
    <textarea #editArea
      class="w-full bg-white dark:bg-black/20 text-gray-900 dark:text-gray-100 text-sm font-normal leading-relaxed whitespace-pre-wrap border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary rounded-lg p-3 min-h-[100px] resize-y"
      [value]="editableContent()" (input)="onEditInput($event)" placeholder="Edita esta publicación aquí...">
      </textarea>
    } @else {
    <!-- Texto del post -->
    <p class="text-gray-700 dark:text-gray-300 text-sm font-normal leading-relaxed whitespace-pre-wrap"
      [innerHTML]="formattedContent()">
    </p>

    <!-- Contenedor de Imagen (Instagram) -->
    @if (isInstagram()) {
    <div class="mt-4 rounded-lg overflow-hidden border border-gray-100 dark:border-gray-800">
      <app-image-container [imageUrl]="currentImageUrl()" [altText]="suggestedPrompt()"
        [isLoading]="post().isLoadingImage ?? false" (imageSelected)="onImageSelected($event)">
      </app-image-container>
    </div>
    }

    <!-- Contenedor de Video (TikTok) -->
    @if (isTikTok()) {
    <div class="mt-4 rounded-lg overflow-hidden border border-gray-100 dark:border-gray-800">
      <app-video-container [videoUrl]="currentVideoUrl()" [isLoading]="post().isLoadingVideo ?? false"
        (videoSelected)="onVideoSelected($event)">
      </app-video-container>
    </div>
    }
    }

    <!-- Publication Status / Permalink -->
    @if (post().publicationStatus === 'success') {
    <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 animate-fade-in">
      @if (post().permalink) {
      <a [href]="post().permalink" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 text-xs font-medium text-primary hover:text-primary/80 transition-colors">
        <span>Ver publicación</span>
        <span class="material-symbols-outlined text-[14px]">open_in_new</span>
      </a>
      } @else {
      <div class="flex items-center gap-1.5 text-xs font-medium text-green-600 dark:text-green-400">
        <span class="material-symbols-outlined text-[16px]">check_circle</span>
        <span>Publicación exitosa</span>
      </div>
      }
    </div>
    }
  </div>
</div>
