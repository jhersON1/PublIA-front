<div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-white/50 dark:bg-black/20 overflow-hidden">
  <div class="flex items-center justify-between p-3 bg-black/5 dark:bg-white/5">
    <div class="flex items-center gap-2">
      <img [src]="iconUrl()" [alt]="platformLabel()" (error)="onIconError($event)" class="w-5 h-5">

      <h3 class="font-bold text-gray-900 dark:text-white">{{ platformLabel() }}</h3>
    </div>
    <div class="flex items-center gap-1">
      <button type="button" (click)="toggleEditing()"
        class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white rounded-lg hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
        [attr.aria-pressed]="isEditing()">
        <span class="material-symbols-outlined text-[20px]">edit</span>
      </button>
      <button type="button" (click)="onCopy()"
        class="p-1.5 text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white rounded-lg hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
        <span class="material-symbols-outlined text-[20px]">content_copy</span>
      </button>
    </div>
  </div>
  <div class="p-4 rounded-md transition-colors" [class.bg-gray-100]="isEditing()"
    [class.dark:bg-white/10]="isEditing()">
    @if (isInstagram()) {
    <!-- Card de Instagram con imagen -->
    @if (isEditing()) {
    <textarea #editArea
      class="w-full bg-transparent text-gray-900 dark:text-gray-100 text-base font-normal leading-relaxed whitespace-pre-wrap border-0 focus:outline-none focus:ring-0 p-2 rounded"
      [value]="editableContent()" (input)="onEditInput($event)" placeholder="Edita el prompt sugerido aqui...">
        </textarea>
    } @else {
    <!-- Mostrar el prompt sugerido -->
    <div class="mb-4">
      <p class="text-sm text-gray-600 dark:text-gray-400 font-semibold mb-2">Prompt sugerido:</p>
      <p class="text-gray-800 dark:text-gray-200 text-base font-normal leading-relaxed whitespace-pre-wrap p-2">{{
        suggestedPrompt() }}</p>
    </div>

    <!-- Mostrar la imagen o el spinner de carga -->
    <div class="mt-4">
      <app-image-container [imageUrl]="currentImageUrl()" [altText]="suggestedPrompt()"
        [isLoading]="post().isLoadingImage ?? false" (imageSelected)="onImageSelected($event)">
      </app-image-container>
    </div>
    }
    } @else if (isTikTok()) {
    <!-- Card de TikTok con video -->
    @if (isEditing()) {
    <textarea #editArea
      class="w-full bg-transparent text-gray-900 dark:text-gray-100 text-base font-normal leading-relaxed whitespace-pre-wrap border-0 focus:outline-none focus:ring-0 p-2 rounded"
      [value]="editableContent()" (input)="onEditInput($event)" placeholder="Edita el prompt sugerido aqui...">
        </textarea>
    } @else {
    <!-- Mostrar el prompt sugerido -->
    <div class="mb-4">
      <p class="text-sm text-gray-600 dark:text-gray-400 font-semibold mb-2">Prompt sugerido:</p>
      <p class="text-gray-800 dark:text-gray-200 text-base font-normal leading-relaxed whitespace-pre-wrap p-2">{{
        suggestedPrompt() }}</p>
    </div>

    <!-- Mostrar el video o el spinner de carga -->
    <div class="mt-4">
      <app-video-container [videoUrl]="currentVideoUrl()" [isLoading]="post().isLoadingVideo ?? false"
        (videoSelected)="onVideoSelected($event)">
      </app-video-container>
    </div>
    }
    } @else {
    <!-- Card normal para otras redes sociales -->
    @if (isEditing()) {
    <textarea #editArea
      class="w-full bg-transparent text-gray-900 dark:text-gray-100 text-base font-normal leading-relaxed whitespace-pre-wrap border-0 focus:outline-none focus:ring-0 p-2 rounded"
      [value]="editableContent()" (input)="onEditInput($event)" placeholder="Edita esta publicacion aqui...">
        </textarea>
    } @else {
    <p class="text-gray-800 dark:text-gray-200 text-base font-normal leading-relaxed whitespace-pre-wrap p-2"
      [innerHTML]="formattedContent()"></p>
    }
    }
  </div>
</div>
