<div class="flex gap-3 p-4">
  <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 shrink-0"
    [style.background-image]="'url(' + message().avatar + ')'"></div>
  <div class="flex flex-1 flex-col items-stretch gap-2">
    <div class="flex flex-col gap-1">
      <div class="flex flex-wrap items-center gap-3">
        <p class="text-gray-900 dark:text-white text-base font-bold leading-tight">
          {{ message().sender === 'user' ? 'You' : 'AI Assistant' }}
        </p>
        <p class="text-gray-500 dark:text-[#9dabb8] text-sm font-normal leading-normal">{{ message().time }}</p>
      </div>
      <p class="text-gray-800 dark:text-gray-200 text-base font-normal leading-relaxed">{{ message().content }}</p>
    </div>
  </div>
</div>
