<div
    class="relative w-full rounded-lg overflow-hidden bg-gray-50 dark:bg-gray-800 min-h-[200px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 dark:border-gray-700 hover:border-gray-400 dark:hover:border-gray-600 transition-colors group">

    @if (isLoading()) {
    <!-- Spinner -->
    <div class="flex flex-col items-center justify-center p-8">
        <div
            class="w-12 h-12 border-4 border-gray-300 dark:border-gray-600 border-t-blue-500 rounded-full animate-spin">
        </div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">Generando imagen...</p>
    </div>
    } @else if (imageUrl()) {
    <!-- Image Display -->
    <div class="relative w-full h-full group/image">
        <img [src]="imageUrl()" [alt]="altText()" class="w-full h-auto object-cover">

        <!-- Overlay to change image (optional, but good UX) -->
        <div
            class="absolute inset-0 bg-black/50 opacity-0 group-hover/image:opacity-100 transition-opacity flex items-center justify-center">
            <label
                class="cursor-pointer px-4 py-2 bg-white/20 backdrop-blur-sm text-white rounded-lg hover:bg-white/30 transition-colors">
                <span class="flex items-center gap-2">
                    <span class="material-symbols-outlined">edit</span>
                    Cambiar imagen
                </span>
                <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
            </label>
        </div>
    </div>
    } @else {
    <!-- Upload Button -->
    <label class="cursor-pointer flex flex-col items-center justify-center w-full h-full p-8">
        <div
            class="p-4 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-400 dark:text-gray-500 group-hover:text-blue-500 dark:group-hover:text-blue-400 group-hover:bg-blue-50 dark:group-hover:bg-blue-900/20 transition-colors">
            <span class="material-symbols-outlined text-4xl">add_photo_alternate</span>
        </div>
        <p
            class="mt-4 text-sm font-medium text-gray-500 dark:text-gray-400 group-hover:text-blue-500 dark:group-hover:text-blue-400">
            Añadir imagen
        </p>
        <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
    </label>
    }
</div>
